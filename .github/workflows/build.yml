name: Node.js Package

on:
push:
branches: [main]
pull_request:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
      uses: actions/checkout@v4

        - name: Set up Node.js
            uses: actions/setup-node@v4
                with:
                      node-version: 22
                            cache: npm

                              - name: Install dependencies
                                  run: npm install

                                    - name: Build application
                                        run: npm run build --if-present